      **B2XA File Template:**
      <?xml version="1.0" encoding="UTF-8"?>
      <b2x:translation xmlns:b2x="http://schemas.ilog.com/JRules/1.3/Translation" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://schemas.ilog.com/JRules/1.3/Translation ilog/rules/schemas/1_3/b2x.xsd">

          <id>unique-b2xa-uuid-here</id>

          <lang>ARL</lang>

      </b2x:translation>

      **BOM Reserved Keywords (CRITICAL - Discovered from Aviation Compliance Project):**
      1. **"operator" is a RESERVED KEYWORD in BOM syntax** - causes compilation errors
         - WRONG XOM property name: private Operator operator;
         - CORRECT XOM property name: private Operator airlineOperator;
         - When you encounter "operator" as a property name, ALWAYS rename it in XOM
         - Update all references in BOM, vocabulary, and rules after renaming
         - Other known reserved keywords to avoid: "function", "rule", "package", "import"

      2. **Deployment Configuration Requirements (CRITICAL):**
         - The .dep file MUST include ruleAppName attribute in root element
         - WRONG: <com.ibm.rules.studio.model.decisionservice:Deployment xmi:version="2.0" ...>
         - CORRECT: <com.ibm.rules.studio.model.decisionservice:Deployment xmi:version="2.0" ... ruleAppName="ProjectName" managingXom="true">
         - Without ruleAppName, Build Command fails with "A RuleApp name cannot be empty"
         - The ruleAppName should match the project name without spaces (use camelCase)
         - **CRITICAL:** The .dep file MUST include ruleset.version property inside the <operations> element:
             ```xml
             <operations operationName="ProjectNameOperation">
               <operation href="ProjectNameOperation.dop#operation-uuid"/>
               <properties key="ruleset.version">
                 <value><![CDATA[1.0]]></value>
               </properties>
             </operations>
             ```
         - Without ruleset.version property, deployment fails with "The property 'ruleset.version' is required and not yet set"
         - The .dop file should also include rulesetVersion="1.0" attribute in the Operation element

      3. **Build Properties File Configuration:**
         - When creating buildcommand/samples/config-files/[ProjectName].properties, include:
           * project = ../../../[ProjectName]
           * output = ../../../[ProjectName]/output
           * dep = [ProjectName]  (this becomes the RuleApp JAR filename prefix)
           * xom-classpath = ../../../[xom-project-name]/[xom-project-name]-1.0.0.jar
           * ruleapp-name = ProjectName  (optional but recommended for clarity)

      4. **Vocabulary Phrase Ambiguity Prevention:**
         - Avoid using common words that appear in multiple phrase contexts
         - Words like "overall", "compliance", "total", "count" can cause ambiguity
         - When a vocabulary phrase causes "Ambiguous sentence" errors, use more specific terms
         - Example: Instead of "overall violations", use "recorded violations" or "detected violations"
         - Test vocabulary phrases by ensuring they don't share common prefix patterns

      5. **Collection Property Access in Rules:**
         - When checking if a collection is empty, use vocabulary method phrases, not direct property access
         - WRONG: the violations of 'the request' is empty
         - CORRECT: Create a computed boolean method in XOM: public boolean hasAnyViolations()
         - BOM: public boolean hasAnyViolations();  // Direct method call syntax (Pattern 3)
         - Vocabulary: hasAnyViolations()#phrase.navigation = {this} has violations  // WITH parentheses
         - Rule: it is not true that 'the request' has violations
      
      **PROVEN PATTERNS FROM SUCCESSFUL BUILD (SimpleLoanApproval & Aviation Compliance Projects):**

      These patterns were validated through iterative Build Command testing and represent working solutions to common ODM compilation challenges.

      **1. Three-Pattern Approach for BOM/XOM Mapping (CRITICAL):**
         - **Pattern 1 - Standard JavaBean Properties (getter + setter):** Auto-map with loadGetterSetterAsProperties=true
           XOM: public int getAge() + public void setAge(int age)
           BOM: public int age;  // Auto-mapped, no explicit declaration needed
           Vocabulary: age#phrase.navigation = {age} of {this}  // NO parentheses
         
         - **Pattern 2 - Computed Properties with "is" Prefix (getter-only):** Can declare as readonly property
           XOM: public boolean isEmployed() { return ...; }  // No setter
           BOM: public readonly boolean employed;  // ODM strips "is" prefix
           Vocabulary: employed#phrase.navigation = {this} is employed  // NO parentheses
         
         - **Pattern 3 - Computed Properties with Other Prefixes (getter-only):** MUST use direct method call syntax
           XOM: public boolean hasMinimumIncome() { return ...; }  // No setter
           BOM: public boolean hasMinimumIncome();  // Direct method call with parentheses
           Vocabulary: hasMinimumIncome()#phrase.navigation = {this} has minimum income  // WITH parentheses
           **CRITICAL:** Methods with prefixes like has, meets, qualifies, requires CANNOT be auto-mapped as properties
           **ERROR if declared as property:** "[B2X] GBREX0021E: Cannot find attribute 'hasMinimumIncome' in execution class"
         
         - **Pattern 2 Example - Numeric Computed Property with Standard Getter:**
           XOM: public double getCo2PerRpk() { return co2EmissionsKg / (passengerCount * distanceKm); }
           BOM: public readonly double co2PerRpk;  // Standard getter pattern, can map as property
           Vocabulary: co2PerRpk#phrase.navigation = {CO2 per RPK} of {this}  // NO parentheses
         
         - **Pattern 2 Example - Boolean Computed Property with "is" Prefix:**
           XOM: public boolean isCertifiedAfter2025() { return certificationDate.after(new Date(2025, 0, 1)); }
           BOM: public readonly boolean certifiedAfter2025;  // "is" prefix stripped, maps as property
           Vocabulary: certifiedAfter2025#phrase.navigation = {this} is certified after 2025  // NO parentheses
         - The "factory.ignore" annotation prevents ODM from trying to instantiate via this property
         - The readonly modifier indicates the property cannot be modified in rules

      **2. Property Naming Consistency Across Layers:**
         - XOM property name: private Operator airlineOperator;
         - XOM getter: public Operator getAirlineOperator()
         - XOM setter: public void setAirlineOperator(Operator airlineOperator)
         - BOM property: public com.aviation.compliance.Operator airlineOperator;
         - Vocabulary navigation: ComplianceRequest.airlineOperator#phrase.navigation = {airline operator} of {this}
         - Vocabulary action: ComplianceRequest.airlineOperator#phrase.action = set the airline operator of {this} to {airline operator}
         - Rule usage: the airline operator of 'the request'
         - CRITICAL: All layers must use the same base property name (airlineOperator), not reserved keywords

      **3. Collection Property Patterns:**
         - Collections in BOM: public readonly java.util.Collection violations domain 0,* class string;
         - Always use readonly for collections to prevent replacement, only allow add/remove operations
         - Vocabulary for collection: Flight.violations#phrase.navigation = {violations} of {this}
         - Vocabulary for add method: Flight.addViolation(java.lang.String)#phrase.action = add {0} to the violations of {this}
         - Rule usage: add "violation message" to the violations of the flight of 'the request' ;
         - NEVER try to check if collection is empty directly - use computed boolean property instead

      **4. Multi-Action Rule Pattern (CRITICAL):**
         - When 'then' clause has multiple actions, EVERY action MUST end with semicolon
         - Pattern:
           if
             condition1
             and condition2
           then
             action1 ;
             action2 ;
             action3 ;
         - Real example from Aviation Compliance:
           if
             the airline operator of 'the request' is not null
             and the offset deficit of the airline operator of 'the request' is more than 0
           then
             add ( the offset deficit of the airline operator of 'the request' * 100 ) to the penalty amount of the airline operator of 'the request' ;
             add ( the offset deficit of the airline operator of 'the request' * 100 ) to the total penalty amount of 'the request' ;
             add "Section 7.1: Penalty of $100 per metric ton for unoffset CO2" to the messages of the airline operator of 'the request' ;

      **5. Null-Safe Navigation Pattern:**
         - ALWAYS check intermediate objects for null before accessing their properties
         - Pattern:
           if
             the parent of 'the request' is not null
             and the child of the parent of 'the request' is not null
             and the property of the child of the parent of 'the request' is more than 100
           then
             action ;
         - Real example:
           if
             the flight of 'the request' is not null
             and the aircraft of 'the request' is not null
             and the aircraft of 'the request' is certified after 2025
             and the CO2 per RPK of the flight of 'the request' is more than 85
           then
             add "violation message" to the violations of the flight of 'the request' ;

      **6. Vocabulary Phrase Disambiguation Strategy:**
         - When two phrases share common prefix tokens, ODM parser gets confused
         - WRONG: Both "add {0} to the violations of {this}" and "add {0} to the messages of {this}" start with "add {0} to the"
         - SOLUTION: Use distinct opening tokens or different verb patterns
         - CORRECT: "add {0} to the violations of {this}" vs "record message {0} on {this}"
         - Aviation Compliance uses consistent "add {0} to the X of {this}" pattern successfully because:
           * Each collection has a unique name (violations, messages, overallViolations, overallMessages)
           * The full phrase including collection name is unique
           * No two phrases share the exact same token sequence

      **7. Arithmetic Expression Pattern in Rules:**
         - Arithmetic operations in BAL use standard operators: + - * /
         - Parentheses are required for complex expressions
         - Pattern: add ( expression1 * expression2 ) to the property of 'the variable' ;
         - Real example: add ( the offset deficit of the airline operator of 'the request' * 100 ) to the penalty amount of the airline operator of 'the request' ;
         - String concatenation uses + operator: "text " + the property of 'the variable' + " more text"
         - Real example: "Section 3.1: Insufficient offset credits purchased - deficit of " + the offset deficit of the airline operator of 'the request' + " metric tons"

      **8. Boolean Property Vocabulary Patterns:**
         - For boolean properties with standard getter/setter:
           XOM: private boolean meetsGaea2025Standard; with isMetGaea2025Standard() and setMeetsGaea2025Standard()
           BOM: public boolean meetsGaea2025Standard; (auto-mapped)
           Vocabulary navigation: Aircraft.meetsGaea2025Standard#phrase.navigation = {this} meets GAEA 2025 standard
           Vocabulary action: Aircraft.meetsGaea2025Standard#phrase.action = make it {meets GAEA 2025 standard} that {this} meets GAEA 2025 standard
           Rule condition: the aircraft of 'the request' meets GAEA 2025 standard
           Rule negation: it is not true that the aircraft of 'the request' meets GAEA 2025 standard
         - For computed boolean properties (no setter):
           XOM: public boolean isCertifiedAfter2025() { return ...; } (no setter)
           BOM: public readonly boolean certifiedAfter2025 property "factory.ignore" "true";
           Vocabulary: Aircraft.certifiedAfter2025#phrase.navigation = {this} is certified after 2025
           Rule: the aircraft of 'the request' is certified after 2025

      **9. Successful Vocabulary Naming Conventions:**
         - Use descriptive, domain-specific terms that avoid ODM reserved keywords
         - SAFE terms used in Aviation Compliance: airline operator, flight, aircraft, compliance request, violations, messages, emissions, offset, penalty
         - AVOIDED terms: operator (reserved), overall (ambiguous), total (ambiguous), count (ambiguous)
         - When a term causes conflicts, add qualifying prefix: "airline operator" instead of "operator"
         - Collection names should be plural and descriptive: violations, messages, overallViolations, overallMessages

      **10. Working BOM Structure Pattern:**
          - Start with property declarations (loadGetterSetterAsProperties, origin, uuid)
          - Declare package
          - For each class:
            * Declare all simple properties (auto-mapped from XOM getters/setters)
            * Declare computed properties with factory.ignore annotation
            * Declare collections as readonly with domain specification
            * Declare constructors with forConversion annotation for primary constructor
            * Declare default constructor
            * Declare methods (add, remove, compute, etc.)
          - Real example structure from Aviation Compliance ComplianceRequest:
            public com.aviation.compliance.Flight flight;
            public com.aviation.compliance.Aircraft aircraft;
            public com.aviation.compliance.Operator airlineOperator;
            public readonly java.util.Collection overallViolations domain 0,* class string;
            public readonly java.util.Collection overallMessages domain 0,* class string;
            public string overallComplianceStatus;
            public double totalPenaltyAmount;
            public ComplianceRequest(Flight, Aircraft, Operator) property "ilog.rules.engine.dataio.forConversion" "true";
            public ComplianceRequest();
            public void addOverallViolation(string arg);
            public void addOverallMessage(string arg);
            public void addToPenalty(double arg);

      **Decision Table Template (.dta) for Scoring Applications:**

      Decision tables are ideal for scoring, rating, and classification rules where multiple conditions map to specific actions or values. They provide a tabular view that's easier to maintain than multiple individual rules.
      A decision table groups rules that have similar conditions and actions, and helps you spot problems such as overlaps and gaps among the rules.
      A decision table contains rows and columns that work together to form rules. The decision engine executes the rules row by row, from the first row to the last row.
      When an application calls a decision table, the action rules are executed. If the conditions in a row are met, the rule that is formed by the row performs the actions in the row.
      You can add rows to the decision table and enter values in their cells to create new rules. You can also define preconditions that apply to all the rules in a table.

      **When to Use Decision Tables:**
      - Scoring applications (credit scoring, risk assessment, eligibility determination)
      - Rating systems (insurance premiums, pricing tiers, service levels)
      - Classification rules (categorization based on multiple criteria)
      - Lookup tables with range-based conditions
      - Any scenario with multiple condition-action combinations

      **Decision Table Structure:**
      <?xml version="1.0" encoding="UTF-8"?>
      <model.dt:DecisionTable xmi:version="2.0" xmlns:xmi="http://www.omg.org/XMI" xmlns:model.dt="http://ilog.rules.studio/model/dt.ecore">
        <name>scoring-table-name</name>
        <uuid>unique-decision-table-uuid</uuid>
        <categories>any</categories>
        <locale>en_US</locale>
        <definition>
      <DT xmlns="http://schemas.ilog.com/Rules/7.0/DecisionTable" Version="7.0">
        <Body>
          <Properties>
            <Property Name="Check.Overlap.ErrorLevel">Error</Property>
            <Property Name="Lock.ApplyLocking" Type="xs:boolean"><![CDATA[false]]></Property>
            <Property Name="UI.ShowInvisibleColumns" Type="xs:boolean"><![CDATA[true]]></Property>
            <Property Name="UI.ShowRuleView" Type="xs:boolean"><![CDATA[false]]></Property>
          </Properties>
          <Structure>
            <ConditionDefinitions>
              <ConditionDefinition Id="C0">
                <ExpressionDefinition>
                  <Properties>
                    <Property Name="context" Type="ilog.rules.dt.model.check.IlrDTExpressionChecker$IntervalContext">
                      <intervalContext direction="asc" enabled="false"/>
                    </Property>
                  </Properties>
                  <Text><![CDATA[the [property] of 'the [variable]' is at least <min> and less than <max>]]></Text>
                </ExpressionDefinition>
              </ConditionDefinition>
            </ConditionDefinitions>
            <ActionDefinitions>
              <ActionDefinition Id="A0">
                <ExpressionDefinition>
                  <Text><![CDATA[set 'the [result variable]' to 'the [result variable]' + <a number>]]></Text>
                </ExpressionDefinition>
              </ActionDefinition>
            </ActionDefinitions>
          </Structure>
          <Contents>
            <Partition DefId="C0">
              <Condition>
                <Expression>
                  <Text><![CDATA[<a number> is less than <a number>]]></Text>
                  <Param><![CDATA[1000]]></Param>
                </Expression>
                <ActionSet>
                  <Action DefId="A0">
                    <Expression>
                      <Param><![CDATA[10]]></Param>
                    </Expression>
                  </Action>
                </ActionSet>
              </Condition>
              <Condition>
                <Expression>
                  <Param><![CDATA[1000]]></Param>
                  <Param><![CDATA[5000]]></Param>
                </Expression>
                <ActionSet>
                  <Action DefId="A0">
                    <Expression>
                      <Param><![CDATA[50]]></Param>
                    </Expression>
                  </Action>
                </ActionSet>
              </Condition>
              <Condition>
                <Expression>
                  <Text><![CDATA[<a number> is at least <a number>]]></Text>
                  <Param><![CDATA[5000]]></Param>
                </Expression>
                <ActionSet>
                  <Action DefId="A0">
                    <Expression>
                      <Param><![CDATA[100]]></Param>
                    </Expression>
                  </Action>
                </ActionSet>
              </Condition>
            </Partition>
          </Contents>
        </Body>
        <Resources DefaultLocale="en_US">
          <ResourceSet Locale="en_US">
            <Data Name="Definitions(A0)#HeaderText"><![CDATA[Add to score]]></Data>
            <Data Name="Definitions(A0)#Width"><![CDATA[400]]></Data>
            <Data Name="Definitions(C0)#HeaderText"><![CDATA[Condition Range]]></Data>
            <Data Name="Definitions(C0)#Width"><![CDATA[400]]></Data>
            <Data Name="Definitions(C0)[0]#HeaderText"><![CDATA[Min]]></Data>
            <Data Name="Definitions(C0)[1]#HeaderText"><![CDATA[Max]]></Data>
          </ResourceSet>
        </Resources>
      </DT></definition>
      </model.dt:DecisionTable>

      **Key Decision Table Components:**

      1. **ConditionDefinitions**: Define the condition columns
         - Each ConditionDefinition has a unique Id (C0, C1, C2, etc.)
         - ExpressionDefinition contains the BAL condition template with placeholders
         - Use <min>, <max>, <value> as placeholders for parameters
         - intervalContext can enable automatic gap/overlap checking

      2. **ActionDefinitions**: Define the action columns
         - Each ActionDefinition has a unique Id (A0, A1, A2, etc.)
         - ExpressionDefinition contains the BAL action template with placeholders
         - Common patterns: set variable, add to score, assign category

      3. **Contents/Partition**: The actual table rows
         - Each Condition represents one row in the table
         - Expression contains the actual parameter values
         - Special expressions for first/last rows:
           * First row: <![CDATA[<a number> is less than <a number>]]> (open lower bound)
           * Last row: <![CDATA[<a number> is at least <a number>]]> (open upper bound)
           * Middle rows: Use min/max parameters from ConditionDefinition

      4. **Resources**: Column headers and display properties
         - HeaderText: Display name for condition/action columns
         - Width: Column width in pixels
         - Supports localization with different ResourceSet Locale values

      **Real-World Example - Credit Scoring by Income:**
      - Condition: Yearly income ranges (< 10K, 10K-20K, 20K-30K, etc.)
      - Action: Add points to credit score (21, 50, 80, 120, etc.)
      - First row handles income < 10,000 (open lower bound)
      - Last row handles income >= 200,000 (open upper bound)
      - Middle rows handle specific ranges with min/max values

      **Decision Table Best Practices:**
      1. Use decision tables for 5+ similar rules with same structure
      2. Enable overlap checking to catch conflicting conditions
      3. Use meaningful column headers in Resources section
      4. Handle edge cases with open bounds (first/last rows)
      5. Keep condition expressions simple - complex logic belongs in regular rules
      6. Use interval context for automatic gap detection in numeric ranges
      7. Test with boundary values to ensure correct range coverage


      Use these templates as reference. Adapt them to the specific business domain while maintaining the correct structure and format.

      **BUILD ERROR PREVENTION GUIDE - Lessons from Cross-Border Fraud Detection Project**

      This section documents nine specific compilation errors encountered during the Cross-Border Fraud Detection project and provides prevention strategies to ensure future ODM projects generate correctly from the start.

      **Overview of Error Resolution History:**
      - Round 1: Four BAL syntax errors (boolean properties, object initialization, vocabulary phrases)
      - Round 2: Four BOM-to-XOM mapping errors (Pattern 3 violations for methods with non-"is" prefixes)
      - Round 3: Card constructor transformation error (signature mismatch)
      - Round 4: Transaction constructor transformation error (signature mismatch)
      - Round 5: BUILD SUCCESS ✅ (RuleApp JAR generated: 160KB)

      **ERROR CATEGORY 1: BAL Syntax Violations**

      **Error 1.1 - Boolean Property Assignment Syntax:**
      ```
      [ERROR] The word 'is' is expected in place of 'to'
      Rule: data-enrichment.set-default-fraud-decision
      ```
      - **Root Cause**: Used `set the crossBorder of 'the transaction' to true` instead of proper BAL boolean syntax
      - **Correct BAL Syntax**: `make it true that 'the transaction' is cross border`
      - **Prevention Rule**: ALWAYS use `make it true/false that {this} is {adjective}` for boolean property assignments
      - **Never Use**: `set the {boolean property} of {this} to true/false` (Java-style assignment)

      **Error 1.2 - Object Initialization with 'new' Keyword:**
      ```
      [ERROR] The word 'new' is not required
      Rule: data-enrichment.initialize-risk-score
      ```
      - **Root Cause**: Used Java `new` keyword in BAL: `set the riskScore of 'the transaction' to a new RiskScore`
      - **Correct BAL Syntax**: `set the riskScore of 'the transaction' to a RiskScore`
      - **Prevention Rule**: BAL doesn't use `new` keyword for object instantiation - just use the class name
      - **Pattern**: `set the {property} of {this} to a ClassName` (no "new")

      **Error 1.3 & 1.4 - Vocabulary Phrase Conflicts with BAL Keywords:**
      ```
      [ERROR] The word 'the' is expected in place of 'to'
      Rules: risk-scoring.score-high-risk-country, risk-scoring.score-impossible-travel
      ```
      - **Root Cause**: Vocabulary phrases "add {0} points to {this} for rule {1}" and "add triggered rule {0} to {this}" used "to" which conflicts with BAL property navigation syntax
      - **Problematic Vocabulary Patterns**:
        * "add {0} to {this}" - conflicts with property navigation "to"
        * "increase {this} by {0}" - conflicts with arithmetic "by"
        * "add {0} points to {this}" - conflicts with reserved "points" token
      - **Correct Vocabulary Patterns**: Use distinct verbs that don't conflict with BAL operators
        * "record score {0} on {this}" ✅
        * "record triggered rule {0} on {this}" ✅
        * "log value {0} for {this}" ✅
        * "register amount {0} with {this}" ✅
      - **Prevention Rule**: Avoid these tokens in vocabulary action phrases: to, by, points, from, at, with (when used as prepositions)
      - **Safe Verbs**: record, log, register, capture, store, save, mark, flag, note

      **ERROR CATEGORY 2: BOM-to-XOM Mapping Violations (Pattern 3 Errors)**

      **Error 2.1-2.5 - Methods Declared as Properties Instead of Method Calls:**
      ```
      [B2X] GBREX0021E: Cannot find attribute 'hasCompletedKyc' in execution class 'com.fraud.crossborder.Customer'
      [B2X] GBREX0021E: Cannot find attribute 'requiresEnhancedDueDiligence' in execution class 'com.fraud.crossborder.Customer'
      [B2X] GBREX0021E: Cannot find attribute 'canPerformHighValueTransactions' in execution class 'com.fraud.crossborder.Customer'
      [B2X] GBREX0021E: Cannot find attribute 'hasHighRiskMerchantCategory' in execution class 'com.fraud.crossborder.Transaction'
      [B2X] GBREX0021E: Cannot find attribute 'requiresMandatoryEscalation' in execution class 'com.fraud.crossborder.Transaction'
      ```

      - **Root Cause**: Five methods were declared in BOM using property syntax when they should use method call syntax (Pattern 3 violation)
      - **Affected Method Prefixes**: has, requires, can (all violate JavaBeans conventions for property mapping)
      - **Wrong BOM Declaration** (causes GBREX0021E):
        ```brl
        public readonly boolean hasCompletedKyc property "factory.ignore" "true";
        public readonly boolean requiresEnhancedDueDiligence property "factory.ignore" "true";
        public readonly boolean canPerformHighValueTransactions property "factory.ignore" "true";
        ```
      - **Correct BOM Declaration** (Pattern 3 - method call syntax):
        ```brl
        public boolean hasCompletedKyc();
        public boolean requiresEnhancedDueDiligence();
        public boolean canPerformHighValueTransactions();
        ```
      - **Vocabulary Updates Required**: Add parentheses to method phrases
        ```properties
        # WRONG (no parentheses)
        Customer.hasCompletedKyc#phrase.navigation = {this} has completed KYC

        # CORRECT (with parentheses)
        Customer.hasCompletedKyc()#phrase.navigation = {this} has completed KYC
        ```

      **Three-Pattern Approach Decision Tree (MANDATORY):**

      When analyzing an XOM method for BOM declaration, follow this decision tree:

      1. **Does the method have a corresponding setter?**
         - YES → Use Pattern 1 (auto-mapped property, no explicit BOM declaration needed)
         - NO → Continue to step 2

      2. **Does the method name start with "is" prefix?**
         - YES → Use Pattern 2 (can declare as readonly property in BOM)
           * XOM: `public boolean isEmployed() { return ...; }`
           * BOM: `public readonly boolean employed;` (ODM strips "is" prefix)
           * Vocabulary: `employed#phrase.navigation = {this} is employed` (NO parentheses)
         - NO → Use Pattern 3 (MUST declare as method call in BOM)

      3. **Pattern 3 - Method Call Syntax (for all non-"is" prefixes):**
         - **Prefixes requiring Pattern 3**: has, requires, can, meets, qualifies, validates, checks, computes, calculates, determines, evaluates, etc.
         - **BOM Declaration**: `public boolean hasCompletedKyc();` (with parentheses)
         - **Vocabulary**: `hasCompletedKyc()#phrase.navigation = {this} has completed KYC` (WITH parentheses)
         - **Rule Usage**: `'the customer' has completed KYC` (phrase from vocabulary)

      **Prevention Checklist for BOM Creation:**
      - [ ] Analyze ALL XOM methods before creating BOM
      - [ ] For each method without a setter, determine if it uses "is" prefix or other prefix
      - [ ] Methods with "is" prefix → Pattern 2 (optional readonly property declaration)
      - [ ] Methods with other prefixes → Pattern 3 (MANDATORY method call syntax with parentheses)
      - [ ] Update vocabulary phrases to include parentheses for Pattern 3 methods
      - [ ] Never use property syntax for methods with has/requires/can/meets/etc. prefixes

      **ERROR CATEGORY 3: Constructor Transformation Errors**

      **Error 3.1 - Card Constructor Signature Mismatch:**
      ```
      [ERROR] GBRET0009E: Failed to transform usage of constructor 'com.fraud.crossborder.Card.Card(java.lang.String cardNumber, java.lang.String cardType, java.lang.String issuingCountry)'
      Rule: data-enrichment.validate-required-fields
      ```
      - **Root Cause**: BOM declared 3-parameter constructor but XOM only had 2-parameter constructor
      - **BOM Declaration**: `Card(string cardNumber, string cardType, string issuingCountry)` (3 params)
      - **XOM Implementation**: Only `Card(String cardNumber, String issuingCountry)` (2 params)
      - **Fix Applied**: Added missing 3-parameter constructor to Card.java:
        ```java
        public Card(String cardNumber, String cardType, String issuingCountry) {
            this.cardNumber = cardNumber;
            this.cardType = cardType;
            this.issuingCountry = issuingCountry;
        }
        ```
      - **Prevention Rule**: Before declaring constructors in BOM, verify ALL constructors exist in XOM with exact signatures

      **Error 3.2 - Transaction Constructor Signature Mismatch:**
      ```
      [ERROR] GBRET0009E: Failed to transform usage of constructor 'com.fraud.crossborder.Transaction.Transaction(java.lang.String transactionId, double amount, java.lang.String currency)'
      Rule: data-enrichment.validate-required-fields
      ```
      - **Root Cause**: BOM declared 3-parameter constructor but XOM only had 5-parameter constructor
      - **BOM Declaration**: `Transaction(string transactionId, double amount, string currency)` (3 params)
      - **XOM Implementation**: Only `Transaction(String transactionId, double amount, String currency, Customer customer, Card card)` (5 params)
      - **Fix Applied**: Added missing 3-parameter constructor to Transaction.java:
        ```java
        public Transaction(String transactionId, double amount, String currency) {
            this();
            this.transactionId = transactionId;
            this.amount = amount;
            this.currency = currency;
            this.transactionDate = new Date();
        }
        ```
      - **Prevention Rule**: Provide multiple constructor overloads in XOM for flexibility (simple and complex versions)

      **Constructor Synchronization Workflow (MANDATORY):**

      1. **Before Creating BOM - XOM Constructor Analysis:**
         - List all constructors needed for rule initialization
         - For each constructor, determine parameter count and types
         - Check if XOM class has matching constructor
         - If missing, add constructor to XOM first

      2. **XOM Constructor Design Pattern:**
         - Always provide default no-arg constructor: `public ClassName() { }`
         - Provide simple constructor for basic initialization (2-3 key parameters)
         - Provide complex constructor for full object graph (all parameters)
         - Simple constructors should call `this()` to initialize defaults
         - Example:
           ```java
           public Transaction() {
               this.transactionDate = new Date();
               this.riskScore = new RiskScore();
           }
           
           public Transaction(String transactionId, double amount, String currency) {
               this();  // Call default constructor
               this.transactionId = transactionId;
               this.amount = amount;
               this.currency = currency;
           }
           
           public Transaction(String transactionId, double amount, String currency,
                            Customer customer, Card card) {
               this(transactionId, amount, currency);  // Call simple constructor
               this.customer = customer;
               this.card = card;
           }
           ```

      3. **BOM Constructor Declaration Rules:**
         - Declare only constructors that will be used in rules
         - Constructor signatures must match XOM exactly (parameter count, types, order)
         - Mark primary constructor with `property "ilog.rules.engine.dataio.forConversion" "true"`
         - Always declare default constructor: `public ClassName();`
         - Example:
           ```brl
           public Transaction(string transactionId, double amount, string currency)
                       property "ilog.rules.engine.dataio.forConversion" "true";
           public Transaction();
           ```

      4. **Verification Steps Before Build:**
         - [ ] For each BOM constructor declaration, verify matching XOM constructor exists
         - [ ] Parameter count matches exactly
         - [ ] Parameter types match (string→String, double→double, etc.)
         - [ ] Parameter order matches exactly
         - [ ] If mismatch found, add missing constructor to XOM first
         - [ ] Recompile XOM: `javac -cp "lib/*" -d bin src/package/*.java`
         - [ ] Rebuild XOM JAR: `jar cf project-xom-1.0.0.jar -C bin .`
         - [ ] Then update BOM

      **COMPREHENSIVE PREVENTION WORKFLOW**

      **Phase 1: XOM Design (Before Creating BOM)**

      1. **Method Prefix Analysis:**
         - List all methods in each XOM class
         - Categorize by prefix: is, has, requires, can, meets, get, set, add, remove, etc.
         - For each method without a setter:
           * "is" prefix → Can use Pattern 2 (readonly property)
           * Other prefix → MUST use Pattern 3 (method call syntax)
         - Document Pattern assignment for each method

      2. **Constructor Inventory:**
         - List all constructors in each XOM class
         - Note parameter count, types, and order for each
         - Identify which constructors will be used in rules
         - Add missing constructors if needed
         - Recompile XOM after any changes

      3. **Jackson Annotation Verification:**
         - All XOM classes have `@JsonInclude(JsonInclude.Include.NON_NULL)` at class level
         - All computed properties (methods without setters) have `@JsonIgnore` annotation
         - No `Serializable` interface (use Jackson, not Java serialization)

      **Phase 2: BOM Creation (With Error Prevention)**

      1. **Property Declarations:**
         - Set `property loadGetterSetterAsProperties "true"` at top
         - Do NOT explicitly declare properties with standard getters/setters (auto-mapped)
         - Only declare properties when special annotations needed (factory.ignore, readonly)

      2. **Method Declarations:**
         - For Pattern 2 methods (is prefix, no setter):
           * Optional: `public readonly boolean propertyName property "factory.ignore" "true";`
           * ODM strips "is" prefix from method name
         - For Pattern 3 methods (other prefixes, no setter):
           * MANDATORY: `public returnType methodName();` (with parentheses)
           * Include full method signature with parameter types if method has parameters

      3. **Constructor Declarations:**
         - Verify each constructor exists in XOM before declaring
         - Match parameter count, types, and order exactly
         - Mark primary constructor with forConversion annotation
         - Always include default constructor

      4. **Collection Declarations:**
         - Always use readonly: `public readonly java.util.Collection items domain 0,* class string;`
         - Provide add/remove methods, not direct collection replacement

      **Phase 3: Vocabulary Creation (With Conflict Prevention)**

      1. **Phrase Token Analysis:**
         - Avoid these tokens in action phrases: to, by, points, from, at, with (as prepositions)
         - Use safe verbs: record, log, register, capture, store, save, mark, flag, note
         - Check for phrase prefix conflicts (two phrases starting with same tokens)

      2. **Method Phrase Syntax:**
         - Pattern 2 methods (is prefix): NO parentheses in phrase
           * `employed#phrase.navigation = {this} is employed`
         - Pattern 3 methods (other prefixes): WITH parentheses in phrase
           * `hasCompletedKyc()#phrase.navigation = {this} has completed KYC`

      3. **Boolean Property Phrases:**
         - Navigation: `{this} is {adjective}` (use single safe adjective)
         - Action: `make it {boolean prop} that {this} is {adjective}`
         - Safe adjectives: active, inactive, approved, rejected, flagged, blocked, whitelisted
         - Avoid: known, present, detected, valid, complete (can cause parser conflicts)

      **Phase 4: BAL Rule Creation (With Syntax Validation)**

      1. **Boolean Property Assignment:**
         - ALWAYS use: `make it true/false that {this} is {adjective}`
         - NEVER use: `set the {boolean property} of {this} to true/false`

      2. **Object Initialization:**
         - ALWAYS use: `set the {property} of {this} to a ClassName`
         - NEVER use: `set the {property} of {this} to a new ClassName`

      3. **Method Invocation:**
         - Pattern 2 methods: Use phrase without parentheses
           * `'the customer' is employed`
         - Pattern 3 methods: Use phrase as defined in vocabulary
           * `'the customer' has completed KYC`

      4. **Multiple Actions:**
         - ALWAYS end each action with semicolon
         - Pattern: `action1 ; action2 ; action3 ;`

      5. **Null Checking:**
         - Always check intermediate objects: `the parent of 'the variable' is not null`
         - NEVER use: `is not defined` (not valid BAL)
         - ALWAYS use: `is null` / `is not null`

      **Phase 5: Pre-Build Validation Checklist (MANDATORY)**

      Before running Build Command, verify:

      - [ ] **XOM Compilation**: All Java classes compile without errors
      - [ ] **XOM JAR**: JAR file built and placed in correct location
      - [ ] **Pattern Analysis**: All methods categorized as Pattern 1, 2, or 3
      - [ ] **BOM Method Syntax**: Pattern 3 methods use method call syntax with parentheses
      - [ ] **BOM Constructors**: All declared constructors exist in XOM with exact signatures
      - [ ] **Vocabulary Parentheses**: Pattern 3 method phrases include parentheses
      - [ ] **Vocabulary Tokens**: No problematic tokens (to, by, points) in action phrases
      - [ ] **BAL Boolean Syntax**: All boolean assignments use "make it true/false that"
      - [ ] **BAL Object Init**: No "new" keyword used for object instantiation
      - [ ] **BAL Null Checks**: Use "is null" / "is not null", never "is not defined"

      **Phase 6: Build Command Execution and Error Resolution**

      1. **Run Build Command:**
         ```bash
         cd buildcommand/samples/config-files && \
         /Library/Java/JavaVirtualMachines/ibm-semeru-open-21.jdk/Contents/Home/bin/java \
         -jar ../../rules-compiler/rules-compiler.jar \
         -config [ProjectName].properties 2>&1
         ```

      2. **Interpret Exit Codes:**
         - Exit 0: BUILD SUCCESS ✅ - RuleApp JAR generated
         - Exit 2: BUILD FAILURE ❌ - Fix errors and retry

      3. **Error Pattern Recognition:**
         - "The word 'X' is expected in place of 'Y'" → BAL syntax error
         - "The word 'new' is not required" → Remove "new" keyword
         - "[B2X] GBREX0021E: Cannot find attribute" → Pattern 3 violation (use method syntax)
         - "GBRET0009E: Failed to transform usage of constructor" → Constructor mismatch (add to XOM)

      4. **Iterative Fix Cycle:**
         - Fix one error at a time (later errors may be cascading)
         - If XOM changed: recompile Java, rebuild JAR, then re-run build
         - If BOM changed: re-run build immediately
         - If vocabulary changed: re-run build immediately
         - If rules changed: re-run build immediately
         - Continue until exit code 0

      **QUICK REFERENCE: Common Error Patterns and Fixes**

      | Error Message | Root Cause | Fix |
      |---------------|------------|-----|
      | "The word 'is' is expected in place of 'to'" | Boolean assignment syntax | Use `make it true/false that {this} is {adjective}` |
      | "The word 'new' is not required" | Java keyword in BAL | Remove "new": `set X to a ClassName` |
      | "The word 'the' is expected in place of 'to'" | Vocabulary phrase conflict | Use distinct verb: "record X on {this}" |
      | "[B2X] GBREX0021E: Cannot find attribute 'hasX'" | Pattern 3 violation | Change BOM to method syntax: `public boolean hasX();` |
      | "GBRET0009E: Failed to transform constructor" | Constructor mismatch | Add matching constructor to XOM, recompile |

      **SUCCESS METRICS**

      A properly configured ODM project should achieve:
      - ✅ Build Command exit code 0 on first attempt
      - ✅ No GBREX0021E errors (all methods use correct pattern)
      - ✅ No GBRET0009E errors (all constructors match)
      - ✅ No BAL syntax errors (correct boolean/object syntax)
      - ✅ RuleApp JAR generated in output/ directory
      - ✅ JAR size appropriate for project complexity (typically 50-200KB)

      By following this comprehensive prevention guide, future ODM projects should generate correctly from the start without requiring iterative error fixes.
